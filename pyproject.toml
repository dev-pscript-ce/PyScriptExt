[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pscript"
version = "0.1.1"
description = "Pscript programming language"
requires-python = ">=3.11"

[project.scripts]
pscript = "main_pscript:main"

[tool.setuptools]
packages = ["pscript", "resolve_path"]
py-modules = ["main_pscript"]